<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Night Screen</title>
  <link rel="stylesheet" href="Night.css">
</head>
<body>

<div class="phone">
  <div class="night-screen page">

    <div class="top-bar">

  <div class="profile">
    <div class="avatar">J</div>
    <span class="name">Jonata</span>
  </div>


  <a href="Chatbot.html" class="notif-btn">
        🤖
      <span class="notif-dot"></span>
      </a>

</div>


    <div class="time-section">
      <h1>11:35 PM</h1>
      <p class="alarm">⏰ 07:35 AM</p>
    </div>

    <div class="moon-container">
        <span class="star s1">⭐</span>
        <span class="star s2">⭐</span>
        <span class="star s3">⭐</span>
        <span class="star s4">⭐</span>
        
        <div class="moon">🌙</div>
    </div>


    <p class="goodnight">Goodnight, Jonata</p>

    <a href="Sleep Analysis.html" class="swipe-btn">
      <span class="arrow">⌃</span>
      <span class="text">Swipe up to stop tracking</span>
    </a>

  </div>
</div>

</body>
</html>
