<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sleep App UI</title>
  <link rel="stylesheet" href="Day.css">
</head>
<body>

<div class="phone">
  <div class="day-screen">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="top-bar">
      <div class="profile">
        <div class="avatar">J</div>
        <span class="name">Jonata</span>
      </div>
      
      <a href="Chatbot.html" class="notif-btn">
        🤖
      <span class="notif-dot"></span>
      </a>
    </div>

    <div class="day-greeting">
      <h2>Hi, Jonata</h2>
      <p>How’s your day?</p>
    </div>

    <div class="sun-container">
      <div class="sun">☀️</div>
    </div>

    <div class="time-section">
      <h1>15:50 PM</h1>
    </div>

    <a href="Sleep Analysis.html" class="swipe-btn">
      <span class="arrow">⌃</span>
      <span class="text">Swipe up to stop tracking</span>
    </a>


  </div>
</div>
<script src="Day.js"></script>
</body>
</html>
